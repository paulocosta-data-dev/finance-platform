rules:

  - rule_id: interest_payment

    enabled: true

    priority: 130

    semantic_type_id: INTEREST_PAYMENT

    confidence: 0.99

    match:

      description_contains:
        - juros

      direction:
        - CREDIT

  - rule_id: term_deposit

    enabled: true

    priority: 120

    semantic_type_id: INTERNAL_TRANSFER

    confidence: 0.99

    match:

      description_contains:
        - dep prazo

  - rule_id: atm_withdrawal

    enabled: true

    priority: 120

    semantic_type_id: ATM_WITHDRAWAL

    confidence: 0.98

    match:

      description_contains:
        - lev atm

      direction:
        - DEBIT

  - rule_id: internal_salary_transfer

    enabled: true

    priority: 115

    semantic_type_id: INTERNAL_TRANSFER

    confidence: 0.98

    match:

      description_contains:
        - ordenado

      direction:
        - DEBIT

  - rule_id: grocery_continente

    enabled: true

    priority: 100

    semantic_type_id: CARD_PURCHASE

    confidence: 0.98

    match:

      description_contains:
        - continente

      direction:
        - DEBIT

  - rule_id: grocery_lidl

    enabled: true

    priority: 100

    semantic_type_id: CARD_PURCHASE

    confidence: 0.98

    match:

      description_contains:
        - lidl

      direction:
        - DEBIT

  - rule_id: peer_transfer_out

    enabled: true

    priority: 90

    semantic_type_id: PEER_TRANSFER

    confidence: 0.95

    match:

      description_startswith:
        - trf p

      direction:
        - DEBIT

  - rule_id: peer_transfer_in

    enabled: true

    priority: 90

    semantic_type_id: PEER_TRANSFER

    confidence: 0.95

    match:

      description_startswith:
        - trf de
        - trf p o

      direction:
        - CREDIT

  - rule_id: generic_card_purchase

    enabled: true

    priority: 50

    semantic_type_id: CARD_PURCHASE

    confidence: 0.90

    match:

      description_startswith:
        - compra

      direction:
        - DEBIT